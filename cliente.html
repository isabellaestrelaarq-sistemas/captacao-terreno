<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acompanhe seu projeto — Isabella Estrela</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--v:#6A2326;--ch:#F0D6AA;--dk:#1A0F10;--bg:#FAF9F6;--soft:#73504F;--line:rgba(209,176,160,.25);--card:#fff;--green:#5F6B52;--greenL:rgba(95,107,82,.12);--red:#9C3B2E}
*{box-sizing:border-box;margin:0}body{font-family:"IBM Plex Sans",sans-serif;background:var(--bg);color:var(--dk);font-size:14px}
.header{background:linear-gradient(135deg,#6A2326 0%,#7B2D30 60%,#6A2326 100%);padding:32px 24px;text-align:center}
.header .brand{font-size:11px;color:rgba(240,214,170,.4);letter-spacing:.12em;text-transform:uppercase}
.header h1{font-family:"Fraunces",serif;font-size:22px;font-weight:300;color:var(--ch);margin-top:8px}
.header .sub{font-size:13px;color:rgba(240,214,170,.5);margin-top:6px}
.wrap{max-width:700px;margin:0 auto;padding:24px 16px 80px}
.login-box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px;text-align:center;margin-bottom:24px}
.login-box p{color:var(--soft);font-size:13px;margin-bottom:14px}
.login-box input{width:100%;max-width:300px;padding:12px 16px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:15px;text-align:center}
.login-box input:focus{outline:2px solid var(--v);border-color:var(--v)}
.login-box button{padding:12px 28px;border:none;border-radius:24px;background:var(--v);color:var(--ch);font:inherit;font-weight:600;cursor:pointer;margin-top:12px}
.login-box .err{color:var(--red);font-size:13px;margin-top:8px}
.portal{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:14px}
.card h2{font-family:"Fraunces",serif;font-size:18px;font-weight:300;color:var(--v);margin-bottom:12px}
.card h3{font-size:13px;color:var(--soft);text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px;margin-bottom:18px}
.scard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}
.scard .n{font-family:"Fraunces",serif;font-size:22px;color:var(--v)}
.scard .l{font-size:10px;color:var(--soft);margin-top:2px}
.next-meeting{background:var(--dk);border-radius:14px;padding:22px;margin-bottom:18px;color:#fff}
.next-meeting .label{font-size:11px;color:rgba(240,214,170,.5);text-transform:uppercase;letter-spacing:.06em}
.next-meeting .data{font-family:"Fraunces",serif;font-size:24px;color:var(--ch);margin:6px 0 4px}
.next-meeting .hora{font-size:14px;color:rgba(240,214,170,.7)}
.tabs{display:flex;gap:0;border-bottom:2px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tab{padding:10px 14px;cursor:pointer;font-size:13px;color:var(--soft);border-bottom:2px solid transparent;margin-bottom:-2px;font-weight:500;white-space:nowrap}
.tab.active{color:var(--v);border-bottom-color:var(--v)}
.section{display:none}.section.active{display:block}
.info-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.info-row:last-child{border-bottom:0}
.info-row .lbl{color:var(--soft)}.info-row .val{font-weight:500;text-align:right;max-width:60%}
.total-card{background:var(--v);border-radius:14px;padding:20px;display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.total-card .lbl{font-family:"Fraunces",serif;color:var(--ch);font-size:15px}
.total-card .val{font-family:"Fraunces",serif;color:#fff;font-size:26px;font-weight:300}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:500}
.badge.agendada{background:rgba(240,214,170,.3);color:#8F6841}
.badge.realizada,.badge.paga,.badge.concluida{background:var(--greenL);color:var(--green)}
.badge.pendente,.badge.aceita,.badge.andamento{background:rgba(106,35,38,.1);color:var(--v)}
.badge.cancelada,.badge.atrasada{background:rgba(156,59,46,.1);color:var(--red)}
/* Timeline etapas */
.timeline{position:relative;padding-left:28px}
.timeline::before{content:'';position:absolute;left:9px;top:4px;bottom:4px;width:2px;background:var(--line)}
.etapa{position:relative;margin-bottom:18px}
.etapa .dot{position:absolute;left:-28px;top:2px;width:20px;height:20px;border-radius:50%;background:var(--line);display:flex;align-items:center;justify-content:center}
.etapa .dot.done{background:var(--green)}.etapa .dot.done::after,.etapa .dot.current::after{content:'';width:8px;height:8px;background:#fff;border-radius:50%}
.etapa .dot.current{background:var(--v);box-shadow:0 0 0 4px rgba(106,35,38,.15)}.etapa .dot.current::after{background:var(--ch)}
.etapa h3{font-size:14px;font-weight:500;margin-bottom:2px}
.etapa .desc{font-size:12px;color:var(--soft)}
.parcela{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
.parcela .num{font-weight:500;font-size:13px}.parcela .venc{font-size:12px;color:var(--soft)}
.parcela .valor{font-family:"Fraunces",serif;font-size:16px;color:var(--v)}
.parcela.paga{border-color:var(--green);background:rgba(95,107,82,.03)}.parcela.paga .valor{color:var(--green)}
.parcela.atrasada{border-color:var(--red);background:rgba(156,59,46,.03)}.parcela.atrasada .valor{color:var(--red)}
.reuniao{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.reuniao .topo{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.reuniao .dt{font-family:"Fraunces",serif;font-size:14px;color:var(--v)}
.reuniao .resumo{font-size:13px;padding:10px;background:rgba(106,35,38,.03);border-radius:8px;margin-top:8px}
.reuniao .decisao{font-size:13px;padding:5px 0;border-bottom:1px solid var(--line);display:flex;gap:8px}
.reuniao .decisao::before{content:"→";color:var(--v);font-weight:600}
.tarefa-card{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:8px}
details.tarefa-card summary::-webkit-details-marker{display:none}
details.tarefa-card[open] summary span:last-child span:last-child{transform:rotate(180deg);display:inline-block}
.msg-box{background:rgba(240,214,170,.12);border-radius:10px;padding:14px;font-size:13px;color:var(--soft);text-align:center;margin-top:14px}
.voltar{display:block;text-align:center;color:var(--v);font-size:13px;margin-top:20px;cursor:pointer;text-decoration:none}
@media(max-width:480px){.wrap{padding:20px 14px}.card{padding:18px}.stats{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="header">
  <div class="brand">ISABELLA ESTRELA</div>
  <h1>Acompanhe seu projeto</h1>
  <div class="sub" id="h-sub"></div>
</div>
<div class="wrap">
  <div class="login-box" id="login-box">
    <p>Digite seu CPF/CNPJ ou o código da proposta (ex.: MO-A1B2C3)</p>
    <input type="text" id="codigo" placeholder="CPF/CNPJ ou MO-XXXXXX" autofocus>
    <br><input type="password" id="senha-cli" placeholder="Senha de acesso" style="margin-top:10px">
    <div style="font-size:11px;color:var(--soft);margin-top:6px">A senha é fornecida pela Isabella. Entrando pelo código da proposta, não precisa de senha.</div>
    <br><button onclick="buscar()">Entrar</button>
    <div class="err" id="err"></div>
  </div>
  <div class="portal" id="portal"></div>
</div>
<script>
const SB='https://mooghvkrendiiwhxynkd.supabase.co';
const SBK='sb_publishable_eRt9feUOHeFOSZjIbfDrJw_ieFaA6Dx';
const SBH={apikey:SBK,Authorization:'Bearer '+SBK};
const brl=v=>v?'R$ '+Number(v).toLocaleString('pt-BR',{minimumFractionDigits:0}):'-';
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
let CODIGO='',PROP=null;

const hash=location.hash.slice(1);
if(hash){document.getElementById('codigo').value=hash;setTimeout(buscar,300);}
document.getElementById('codigo').addEventListener('keydown',e=>{if(e.key==='Enter')buscar();});

function fmtData(d){
  if(!d)return'-';
  const dt=new Date(d.length<=10?d+'T12:00:00':d);
  const dias=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const meses=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  return dias[dt.getDay()]+', '+dt.getDate()+' '+meses[dt.getMonth()]+' '+dt.getFullYear();
}

async function buscar(){
  const input=document.getElementById('codigo').value.trim();
  if(!input){document.getElementById('err').textContent='Digite o código ou CPF';return;}
  document.getElementById('err').textContent='Consultando...';
  const isCpf=input.replace(/\D/g,'').length>=11&&!/[A-Za-z]/.test(input);
  const codigoLimpo=input.toUpperCase().replace(/[^A-Z0-9-]/g,'');
  const filtro=isCpf?'cliente_doc=eq.'+input.replace(/\D/g,''):'codigo=eq.'+encodeURIComponent(codigoLimpo);
  try{
    // Buscar direto no banco
    const sel='codigo,cliente_nome,proposta_titulo,proposta_resumo,total_fixo,pagamento_tipo,status,aceito_em,etapas,docs_cliente,conselho_data,arquivos,cliente_senha';
    const r=await fetch(`${SB}/rest/v1/propostas?${filtro}&select=${sel}&order=aceito_em.desc`,{headers:SBH});
    const lista=await r.json();
    if(!Array.isArray(lista)||!lista.length){document.getElementById('err').textContent='Nenhuma proposta encontrada.';return;}

    // Entrando por CPF/CNPJ: se o cliente tem senha definida, exigir
    if(isCpf){
      const senhaDef=(lista.find(p=>p.cliente_senha&&p.cliente_senha.trim())||{}).cliente_senha;
      if(senhaDef){
        const digitada=(document.getElementById('senha-cli').value||'').trim();
        if(digitada!==senhaDef.trim()){document.getElementById('err').textContent='Senha incorreta. Peça a senha de acesso à Isabella.';return;}
      }
    }

    window._LISTA=lista;
    if(lista.length>1){mostrarLista();return;}
    abrirDireto(lista[0]);
  }catch(e){document.getElementById('err').textContent='Erro de conexão.';}
}
function mostrarLista(){
  const lista=window._LISTA||[];
  document.getElementById('err').textContent='';
  document.getElementById('login-box').style.display='none';
  document.getElementById('portal').style.display='block';
  document.getElementById('h-sub').textContent=lista[0]?.cliente_nome?lista[0].cliente_nome.split(' - ')[0]:'';
  document.getElementById('portal').innerHTML='<div class="card"><h2>Seus projetos</h2>'+lista.map((p,i)=>
    `<div style="padding:12px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer" onclick="abrirProposta(${i})"><b>${esc(p.proposta_titulo||'Proposta')}</b><br><small style="color:var(--soft)">${esc(p.codigo)} · <span class="badge ${esc(p.status||'aceita')}">${esc(p.status||'aceita')}</span></small></div>`
  ).join('')+'</div><a class="voltar" onclick="location.reload()">Sair</a>';
}
function abrirProposta(i){abrirDireto(window._LISTA[i]);}
function abrirDireto(prop){
  PROP=prop;CODIGO=prop.codigo;
  const conselho=prop.conselho_data||null;
  document.getElementById('err').textContent='';
  document.getElementById('login-box').style.display='none';
  document.getElementById('h-sub').textContent=prop.cliente_nome||'';
  document.getElementById('portal').style.display='block';
  render(prop, conselho);
}

function render(p, c){
  const el=document.getElementById('portal');
  const status=p.status||'aceita';
  const stLabel={aceita:'Proposta aceita',paga:'Pagamento confirmado',andamento:'Em andamento',concluida:'Concluído',cancelada:'Cancelada'};
  const hasConselho=c&&(c.reunioes?.length||c.tarefas?.length||c.parcelas?.length);
  const hasEtapas=p.etapas&&p.etapas.length;

  let html='';

  // Próxima reunião (se tiver)
  if(c&&c.proxima_reuniao){
    const proxR=(c.reunioes||[]).filter(r=>r.status==='agendada').sort((a,b)=>a.data>b.data?1:-1)[0]||{};
    html+=`<div class="next-meeting"><div class="label">Próxima reunião</div><div class="data">${fmtData(c.proxima_reuniao.data)}</div><div class="hora">às ${c.proxima_reuniao.hora||'10:00'}${proxR.local?' · '+esc(proxR.local):''}</div>`;
    if(proxR.link)html+=`<a href="${esc(proxR.link)}" target="_blank" style="display:inline-block;margin-top:12px;padding:10px 22px;border-radius:24px;background:var(--ch);color:var(--dk);font-weight:600;font-size:13px;text-decoration:none">Entrar na reunião</a>`;
    if(proxR.pauta)html+=`<div style="margin-top:10px;font-size:12px;color:rgba(240,214,170,.7)"><b>Pauta:</b> ${esc(proxR.pauta)}</div>`;
    html+=`</div>`;
  }

  // Stats
  const reunioesR=c?(c.reunioes||[]).filter(r=>r.status==='realizada').length:0;
  const totalDecisoes=c?(c.decisoes||[]).length:0;
  const parcelasP=c?(c.parcelas||[]).filter(p=>p.status==='paga').length:0;
  const totalParcelas=c?(c.parcelas||[]).length:0;
  const tarefasPend=c?(c.tarefas||[]).filter(t=>t.status!=='concluida').length:0;
  const etapasEntregues=hasEtapas?p.etapas.filter(e=>e.status==='entregue').length:0;

  html+='<div class="stats">';
  if(hasEtapas)html+=`<div class="scard"><div class="n">${etapasEntregues}/${p.etapas.length}</div><div class="l">Etapas entregues</div></div>`;
  if(c&&c.tarefas?.length)html+=`<div class="scard"><div class="n">${tarefasPend}</div><div class="l">Tarefas pendentes</div></div>`;
  if(reunioesR)html+=`<div class="scard"><div class="n">${reunioesR}</div><div class="l">Reuniões</div></div>`;
  if(totalParcelas)html+=`<div class="scard"><div class="n">${parcelasP}/${totalParcelas}</div><div class="l">Parcelas pagas</div></div>`;
  if(!hasEtapas&&!c?.tarefas?.length&&!reunioesR&&!totalParcelas){
    html+=`<div class="scard"><div class="n badge ${status}">${stLabel[status]||status}</div><div class="l">Status</div></div>`;
  }
  html+='</div>';

  // Info card
  html+=`<div class="card"><h2>${esc(p.titulo||p.proposta_titulo||'Sua proposta')}</h2>
    <div class="info-row"><span class="lbl">Status</span><span class="val"><span class="badge ${status}">${stLabel[status]||status}</span></span></div>
    <div class="info-row"><span class="lbl">Código</span><span class="val">${esc(p.codigo)}</span></div>
    <div class="info-row"><span class="lbl">Pagamento</span><span class="val">${esc(p.pagamento||p.pagamento_tipo||'-')}</span></div>
    <div class="info-row"><span class="lbl">Aceito em</span><span class="val">${fmtData(p.aceito_em)}</span></div>
  </div>`;

  // Tabs dinâmicas
  let tabs=[];
  if(hasEtapas)tabs.push({id:'etapas',label:'Etapas'});
  if(c&&c.tarefas?.length)tabs.push({id:'tarefas',label:'Tarefas'});
  if(c&&c.reunioes?.length)tabs.push({id:'reunioes',label:'Reuniões'});
  if(totalDecisoes)tabs.push({id:'decisoes',label:'Decisões'});
  if(totalParcelas)tabs.push({id:'financeiro',label:'Financeiro'});
  if(c&&c.documentos?.length)tabs.push({id:'diretrizes',label:'Diretrizes'});
  tabs.push({id:'documentos',label:'Documentos'});

  if(tabs.length){
    html+='<div class="tabs">';
    tabs.forEach((t,i)=>{html+=`<div class="tab${i===0?' active':''}" onclick="switchTab('${t.id}')">${t.label}</div>`;});
    html+='</div>';
    tabs.forEach((t,i)=>{html+=`<div class="section${i===0?' active':''}" id="sec-${t.id}"></div>`;});
  }

  html+=`<div class="msg-box">Dúvidas sobre o seu projeto? A Isabella entrará em contato com você nos próximos passos.</div>`;
  if(window._LISTA&&window._LISTA.length>1){
    html+=`<a class="voltar" onclick="mostrarLista()">&larr; Meus projetos</a>`;
  }else{
    html+=`<a class="voltar" onclick="document.getElementById('login-box').style.display='block';document.getElementById('portal').style.display='none';document.getElementById('h-sub').textContent='';">Sair</a>`;
  }

  el.innerHTML=html;

  // Preencher seções
  if(hasEtapas)renderEtapas(p.etapas);
  if(c&&c.tarefas?.length)renderTarefas(c.tarefas);
  if(c&&c.reunioes?.length)renderReunioes(c.reunioes);
  if(totalDecisoes)renderDecisoes(c.decisoes);
  if(totalParcelas)renderFinanceiro(c.parcelas);
  if(c&&c.documentos?.length)renderDiretrizes(c.documentos);
  renderDocumentos();
}

// ===== DOCUMENTOS: checklist + envio de arquivos =====
function renderDocumentos(){
  const el=document.getElementById('sec-documentos');
  if(!el)return;
  let h='';
  // Checklist de documentos necessários
  const docs=PROP.docs_cliente||[];
  if(docs.length){
    const feitos=docs.filter(d=>d.feito).length;
    h+=`<div class="card"><h3>Documentos necessários (${feitos}/${docs.length})</h3>`;
    docs.forEach(d=>{
      h+=`<div style="padding:5px 0;font-size:13px;${d.feito?'color:var(--green)':''}"><span style="margin-right:8px">${d.feito?'&#10003;':'&#9675;'}</span>${esc(d.item)}</div>`;
    });
    h+=`</div>`;
  }
  // Arquivos enviados
  const arqs=PROP.arquivos||[];
  h+=`<div class="card"><h3>Arquivos enviados</h3>`;
  if(arqs.length){
    arqs.forEach(a=>{
      h+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px">
        <a href="${esc(a.url)}" target="_blank" style="color:var(--v);text-decoration:none;word-break:break-all">&#128196; ${esc(a.nome)}</a>
        <small style="color:var(--soft);white-space:nowrap;margin-left:10px">${esc(a.data||'')}${a.por?' · '+esc(a.por):''}</small>
      </div>`;
    });
  }else{
    h+=`<div style="font-size:13px;color:var(--soft)">Nenhum arquivo enviado ainda.</div>`;
  }
  h+=`<div style="margin-top:14px;text-align:center">
    <input type="file" id="up-file" multiple style="display:none" onchange="enviarArquivos(this.files)">
    <button onclick="document.getElementById('up-file').click()" style="padding:11px 24px;border:none;border-radius:24px;background:var(--v);color:var(--ch);font:inherit;font-weight:600;cursor:pointer">Enviar documento</button>
    <div id="up-msg" style="font-size:12px;color:var(--soft);margin-top:8px"></div>
  </div></div>`;
  el.innerHTML=h;
}
async function enviarArquivos(files){
  if(!files||!files.length)return;
  const msg=document.getElementById('up-msg');
  PROP.arquivos=PROP.arquivos||[];
  for(const f of files){
    if(f.size>25*1024*1024){msg.textContent=f.name+' passa de 25 MB, envie um arquivo menor.';continue;}
    msg.textContent='Enviando '+f.name+'...';
    const nomeLimpo=f.name.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9._-]/g,'_');
    const caminho=CODIGO+'/'+Date.now()+'-'+nomeLimpo;
    try{
      const r=await fetch(SB+'/storage/v1/object/docs/'+caminho,{method:'POST',headers:{apikey:SBK,Authorization:'Bearer '+SBK,'Content-Type':f.type||'application/octet-stream'},body:f});
      if(!r.ok)throw new Error('HTTP '+r.status);
      const url=SB+'/storage/v1/object/public/docs/'+caminho;
      PROP.arquivos.push({nome:f.name,url,data:new Date().toISOString().slice(0,10),por:'cliente'});
    }catch(e){msg.textContent='Erro ao enviar '+f.name+': '+e.message;return;}
  }
  // Gravar a lista na proposta
  try{
    const r=await fetch(SB+'/rest/v1/propostas?codigo=eq.'+encodeURIComponent(CODIGO),{method:'PATCH',headers:{apikey:SBK,Authorization:'Bearer '+SBK,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({arquivos:PROP.arquivos})});
    if(!r.ok)throw new Error('HTTP '+r.status);
    msg.textContent='Enviado com sucesso. A Isabella será notificada.';
    renderDocumentos();
  }catch(e){msg.textContent='Erro ao registrar: '+e.message;}
}

function switchTab(id){
  document.querySelectorAll('.tab').forEach(t=>{t.classList.toggle('active',t.textContent===document.querySelector('.tab[onclick*=\"'+id+'\"]')?.textContent);});
  document.querySelectorAll('.section').forEach(s=>{s.classList.toggle('active',s.id==='sec-'+id);});
}

function renderEtapas(etapas){
  const el=document.getElementById('sec-etapas');
  if(!el)return;
  const stMap={entregue:'done',andamento:'current',pendente:''};
  const stLabel={entregue:'Concluída',andamento:'Em andamento',pendente:'Aguardando'};
  const stColor={entregue:'var(--green)',andamento:'var(--v)',pendente:'var(--soft)'};
  el.innerHTML='<div class="timeline">'+etapas.map(e=>{
    const st=e.status||'pendente';
    let checkHtml='';
    if(e.checklist&&e.checklist.length&&st!=='pendente'){
      checkHtml='<div style="margin-top:6px;font-size:12px">'+e.checklist.map(c=>
        '<div style="padding:2px 0;'+(c.feito?'color:var(--green)':'color:var(--soft)')+'"><span style="margin-right:6px">'+(c.feito?'&#10003;':'&#9675;')+'</span>'+esc(c.item)+'</div>'
      ).join('')+'</div>';
    }
    return'<div class="etapa"><div class="dot '+(stMap[st]||'')+'"></div><h3>'+esc(e.n)+'. '+esc(e.t)+'</h3><div class="desc" style="color:'+stColor[st]+'">'+stLabel[st]+(e.entrega&&st==='entregue'?' em '+fmtData(e.entrega):'')+'</div>'+(e.pago?'<div style="font-size:11px;color:var(--green);margin-top:2px">Pago</div>':'')+checkHtml+'</div>';
  }).join('')+'</div>';
}

function renderTarefas(tarefas){
  const el=document.getElementById('sec-tarefas');
  if(!el)return;
  const pend=tarefas.filter(t=>t.status!=='concluida');
  const conc=tarefas.filter(t=>t.status==='concluida');
  let h='';
  const cardTarefa=(t,done)=>{
    const prio={alta:'var(--red)',normal:'var(--v)',baixa:'var(--soft)'};
    const ckT=t.checklist?t.checklist.length:0;
    const ckF=t.checklist?t.checklist.filter(c=>c.feito).length:0;
    let h=`<details class="tarefa-card" style="padding:0;overflow:hidden${done?';border-color:var(--green);opacity:.8':''}">
      <summary style="list-style:none;cursor:pointer;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:8px">
        <span style="display:flex;flex-direction:column;gap:2px;flex:1">
          <b style="font-size:14px;${done?'text-decoration:line-through':''}">${esc(t.titulo||'Tarefa')}</b>
          <span style="font-size:11px;color:var(--soft)">${done?'Concluída'+(t.concluida_em?' em '+fmtData(t.concluida_em):''):(ckT?ckF+'/'+ckT+' itens feitos':'Toque para ver detalhes')}${t.prazo&&!done?' · prazo '+fmtData(t.prazo):''}</span>
        </span>
        <span style="display:flex;gap:6px;align-items:center">
          ${done?'<span class="badge concluida">concluída</span>':`<span class="badge" style="background:${prio[t.prioridade]||'var(--v)'};color:#fff">${t.prioridade||'normal'}</span>`}
          <span style="color:var(--soft);font-size:12px">&#9662;</span>
        </span>
      </summary>
      <div style="padding:0 14px 14px">`;
    if(t.descricao)h+=`<div style="font-size:12px;color:var(--soft);white-space:pre-line;padding:10px;background:rgba(106,35,38,.03);border-radius:8px">${esc(t.descricao)}</div>`;
    if(t.responsavel)h+=`<div style="font-size:11px;color:var(--soft);margin-top:6px">Responsável: ${esc(t.responsavel)}</div>`;
    if(t.checklist&&t.checklist.length){
      h+='<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--line)">';
      t.checklist.forEach((c,ci)=>{
        h+=`<label style="display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12px;cursor:pointer;${c.feito?'color:var(--green)':''}">
          <input type="checkbox" ${c.feito?'checked':''} onchange="cliToggleCheck(${t.id},${ci},this.checked)" style="accent-color:var(--v);width:16px;height:16px">
          <span style="${c.feito?'text-decoration:line-through':''}">${esc(c.item)}</span>
        </label>`;
      });
      h+='</div>';
    }
    if(!t.descricao&&!(t.checklist&&t.checklist.length))h+=`<div style="font-size:12px;color:var(--soft)">Sem detalhes ainda.</div>`;
    if(!done){
      h+=`<button onclick="cliConcluirTarefa(${t.id})" style="margin-top:10px;padding:8px 18px;border:none;border-radius:20px;background:var(--green);color:#fff;font:inherit;font-size:12px;font-weight:600;cursor:pointer">Marcar tarefa como concluída</button>`;
    }else{
      h+=`<button onclick="cliReabrirTarefa(${t.id})" style="margin-top:10px;padding:6px 14px;border:1px solid var(--line);border-radius:20px;background:none;color:var(--soft);font:inherit;font-size:11px;cursor:pointer">Reabrir tarefa</button>`;
    }
    h+='<div id="t-msg-'+t.id+'" style="font-size:11px;color:var(--soft);margin-top:6px"></div>';
    h+='</div></details>';
    return h;
  };
  if(pend.length){
    h+='<div style="margin-bottom:10px"><b style="font-size:11px;color:var(--soft);text-transform:uppercase">Pendentes ('+pend.length+')</b></div>';
    pend.forEach(t=>{h+=cardTarefa(t,false);});
  }
  if(conc.length){
    h+=`<div style="margin:14px 0 10px"><b style="font-size:11px;color:var(--soft);text-transform:uppercase">Concluídas (${conc.length})</b></div>`;
    conc.forEach(t=>{h+=cardTarefa(t,true);});
  }
  el.innerHTML=h;
}

function renderReunioes(reunioes){
  const el=document.getElementById('sec-reunioes');
  if(!el)return;
  const sorted=[...reunioes].sort((a,b)=>b.data>a.data?1:-1);
  el.innerHTML=sorted.map(r=>{
    let h=`<div class="reuniao"><div class="topo"><span class="dt">${fmtData(r.data)} às ${r.hora||''}</span><span class="badge ${r.status}">${r.status}</span></div>`;
    if(r.pauta)h+=`<div style="font-size:13px;color:var(--soft)"><b>Pauta:</b> ${esc(r.pauta)}</div>`;
    if(r.status==='agendada'&&r.link)h+=`<div style="margin-top:6px"><a href="${esc(r.link)}" target="_blank" style="color:var(--v);font-size:13px;font-weight:600">Entrar na reunião &rarr;</a></div>`;
    if(r.resumo)h+=`<div class="resumo"><b>Resumo:</b> ${esc(r.resumo)}</div>`;
    if(r.decisoes&&r.decisoes.length){h+=`<div style="margin-top:8px"><b style="font-size:12px;color:var(--soft)">Decisões:</b>`;r.decisoes.forEach(d=>{if(d)h+=`<div class="decisao">${esc(d)}</div>`;});h+='</div>';}
    h+='</div>';return h;
  }).join('');
}

// A equipe do cliente pode marcar itens e concluir tarefas
async function cliSalvarConselho(tid,texto){
  const msg=document.getElementById('t-msg-'+tid);
  try{
    const r=await fetch(SB+'/rest/v1/propostas?codigo=eq.'+encodeURIComponent(CODIGO),{method:'PATCH',headers:{apikey:SBK,Authorization:'Bearer '+SBK,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({conselho_data:PROP.conselho_data})});
    if(!r.ok)throw new Error('HTTP '+r.status);
    if(msg)msg.textContent=texto||'Salvo.';
  }catch(e){if(msg)msg.textContent='Erro ao salvar: '+e.message;}
}
function cliAchaTarefa(tid){return ((PROP.conselho_data||{}).tarefas||[]).find(t=>t.id===tid);}
async function cliToggleCheck(tid,ci,val){
  const t=cliAchaTarefa(tid);
  if(!t||!t.checklist[ci])return;
  t.checklist[ci].feito=val;
  await cliSalvarConselho(tid,'Atualizado.');
}
async function cliConcluirTarefa(tid){
  const t=cliAchaTarefa(tid);
  if(!t)return;
  t.status='concluida';t.concluida_em=new Date().toISOString().slice(0,10);
  await cliSalvarConselho(tid,'');
  renderTarefas(PROP.conselho_data.tarefas);
}
async function cliReabrirTarefa(tid){
  const t=cliAchaTarefa(tid);
  if(!t)return;
  t.status='pendente';t.concluida_em=null;
  await cliSalvarConselho(tid,'');
  renderTarefas(PROP.conselho_data.tarefas);
}

function renderDecisoes(decisoes){
  const el=document.getElementById('sec-decisoes');
  if(!el)return;
  el.innerHTML=[...decisoes].sort((a,b)=>b.created>a.created?1:-1).map(d=>
    `<div style="padding:10px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px"><div style="font-size:13px;font-weight:500">${esc(d.texto)}</div><div style="font-size:11px;color:var(--soft);margin-top:4px">${fmtData(d.data)}</div></div>`
  ).join('');
}

function renderFinanceiro(parcelas){
  const el=document.getElementById('sec-financeiro');
  if(!el)return;
  const totalPago=parcelas.filter(p=>p.status==='paga').reduce((a,p)=>a+(p.valor||0),0);
  const totalGeral=parcelas.reduce((a,p)=>a+(p.valor||0),0);
  const hoje=new Date().toISOString().slice(0,10);
  let h=`<div class="card"><h3>Resumo financeiro</h3>
    <div class="info-row"><span class="lbl">Total</span><span class="val" style="font-family:Fraunces;font-size:16px;color:var(--v)">${brl(totalGeral)}</span></div>
    <div class="info-row"><span class="lbl">Pago</span><span class="val" style="font-family:Fraunces;font-size:16px;color:var(--green)">${brl(totalPago)}</span></div>
    <div class="info-row"><span class="lbl">Restante</span><span class="val" style="font-family:Fraunces;font-size:16px">${brl(totalGeral-totalPago)}</span></div></div>`;
  h+='<div style="margin:14px 0"><b style="font-size:11px;color:var(--soft);text-transform:uppercase">Parcelas</b></div>';
  parcelas.forEach(p=>{
    let cls=p.status;if(p.status==='pendente'&&p.vencimento<hoje)cls='atrasada';
    h+=`<div class="parcela ${cls}"><div><span class="num">Parcela ${p.numero}</span><br><span class="venc">${p.status==='paga'?'Pago em '+fmtData(p.pago_em):'Vencimento: '+fmtData(p.vencimento)}</span></div><div style="text-align:right"><div class="valor">${brl(p.valor)}</div><span class="badge ${cls}">${cls==='atrasada'?'atrasada':p.status}</span></div></div>`;
  });
  el.innerHTML=h;
}

function renderDiretrizes(docs){
  const el=document.getElementById('sec-diretrizes');
  if(!el)return;
  const icons={diretriz:'◆',relatorio:'◎',ata:'◉',orientacao:'◇'};
  el.innerHTML=docs.map(d=>`<div style="display:flex;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;align-items:center"><div style="width:36px;height:36px;border-radius:8px;background:rgba(106,35,38,.06);display:flex;align-items:center;justify-content:center;color:var(--v)">${icons[d.tipo]||'◆'}</div><div><div style="font-size:13px;font-weight:500">${esc(d.titulo)}</div><div style="font-size:12px;color:var(--soft)">${esc(d.descricao||'')} · ${fmtData(d.data)}</div></div></div>`).join('');
}
</script>
