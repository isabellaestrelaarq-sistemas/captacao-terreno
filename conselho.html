<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conselho Estratégico — Isabella Estrela</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--v:#6A2326;--ch:#F0D6AA;--dk:#1A0F10;--bg:#FAF9F6;--soft:#73504F;--line:rgba(209,176,160,.25);--card:#fff;--green:#5F6B52;--greenL:rgba(95,107,82,.12);--red:#9C3B2E}
*{box-sizing:border-box;margin:0}body{font-family:"IBM Plex Sans",sans-serif;background:var(--bg);color:var(--dk);font-size:14px}
.header{background:linear-gradient(135deg,#6A2326 0%,#7B2D30 60%,#6A2326 100%);padding:32px 24px;text-align:center}
.header .brand{font-size:11px;color:rgba(240,214,170,.4);letter-spacing:.12em;text-transform:uppercase}
.header h1{font-family:"Fraunces",serif;font-size:22px;font-weight:300;color:var(--ch);margin-top:8px}
.header .sub{font-size:13px;color:rgba(240,214,170,.5);margin-top:6px}
.wrap{max-width:700px;margin:0 auto;padding:24px 16px 80px}

/* Login */
.login-box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px;text-align:center;margin-bottom:24px}
.login-box p{color:var(--soft);font-size:13px;margin-bottom:14px}
.login-box input{width:100%;max-width:300px;padding:12px 16px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:15px;text-align:center}
.login-box input:focus{outline:2px solid var(--v);border-color:var(--v)}
.login-box button{padding:12px 28px;border:none;border-radius:24px;background:var(--v);color:var(--ch);font:inherit;font-weight:600;cursor:pointer;margin-top:12px}
.login-box .err{color:var(--red);font-size:13px;margin-top:8px}

.portal{display:none}

/* Cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:14px}
.card h2{font-family:"Fraunces",serif;font-size:18px;font-weight:300;color:var(--v);margin-bottom:12px}
.card h3{font-size:13px;color:var(--soft);text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px}

/* Stats row */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.scard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}
.scard .n{font-family:"Fraunces",serif;font-size:24px;color:var(--v)}
.scard .l{font-size:11px;color:var(--soft);margin-top:2px}

/* Próxima reunião destaque */
.next-meeting{background:var(--dk);border-radius:14px;padding:22px;margin-bottom:18px;color:#fff}
.next-meeting .label{font-size:11px;color:rgba(240,214,170,.5);text-transform:uppercase;letter-spacing:.06em}
.next-meeting .data{font-family:"Fraunces",serif;font-size:26px;color:var(--ch);margin:6px 0 4px}
.next-meeting .hora{font-size:14px;color:rgba(240,214,170,.7)}

/* Tabs */
.tabs{display:flex;gap:0;border-bottom:2px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tab{padding:10px 16px;cursor:pointer;font-size:13px;color:var(--soft);border-bottom:2px solid transparent;margin-bottom:-2px;font-weight:500;white-space:nowrap}
.tab.active{color:var(--v);border-bottom-color:var(--v)}
.section{display:none}.section.active{display:block}

/* Reuniões */
.reuniao{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.reuniao .topo{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.reuniao .dt{font-family:"Fraunces",serif;font-size:15px;color:var(--v)}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:500}
.badge.agendada{background:rgba(240,214,170,.3);color:#8F6841}
.badge.realizada{background:var(--greenL);color:var(--green)}
.badge.cancelada{background:rgba(156,59,46,.1);color:var(--red)}
.reuniao .pauta{font-size:13px;color:var(--soft);margin-bottom:6px}
.reuniao .resumo{font-size:13px;padding:10px;background:rgba(106,35,38,.03);border-radius:8px;margin-top:8px}
.reuniao .decisoes{margin-top:8px}
.reuniao .decisao{font-size:13px;padding:6px 0;border-bottom:1px solid var(--line);display:flex;gap:8px}
.reuniao .decisao::before{content:"→";color:var(--v);font-weight:600}

/* Decisões */
.decisao-item{padding:10px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
.decisao-item .texto{font-size:13px;font-weight:500}
.decisao-item .meta{font-size:11px;color:var(--soft);margin-top:4px}

/* Parcelas */
.parcela{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
.parcela .info{display:flex;flex-direction:column;gap:2px}
.parcela .num{font-weight:500;font-size:13px}
.parcela .venc{font-size:12px;color:var(--soft)}
.parcela .valor{font-family:"Fraunces",serif;font-size:16px;color:var(--v)}
.parcela.paga{border-color:var(--green);background:rgba(95,107,82,.03)}
.parcela.paga .valor{color:var(--green)}
.parcela.atrasada{border-color:var(--red);background:rgba(156,59,46,.03)}
.parcela.atrasada .valor{color:var(--red)}

/* Documentos */
.doc-item{padding:10px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;display:flex;gap:12px;align-items:center}
.doc-icon{width:36px;height:36px;border-radius:8px;background:rgba(106,35,38,.06);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--v)}
.doc-info .titulo{font-size:13px;font-weight:500}
.doc-info .desc{font-size:12px;color:var(--soft)}

.msg-box{background:rgba(240,214,170,.12);border-radius:10px;padding:14px;font-size:13px;color:var(--soft);text-align:center;margin-top:14px}
@media(max-width:480px){.stats{grid-template-columns:1fr 1fr 1fr}.next-meeting .data{font-size:22px}}
</style>
</head>
<body>
<div class="header">
  <div class="brand">ISABELLA ESTRELA</div>
  <h1>Conselho Estratégico</h1>
  <div class="sub" id="h-sub"></div>
</div>
<div class="wrap">
  <div class="login-box" id="login-box">
    <p>Digite o código da sua proposta</p>
    <input type="text" id="codigo" placeholder="MO-XXXXXX" autofocus>
    <br><button onclick="carregar()">Acessar</button>
    <div class="err" id="err"></div>
  </div>
  <div class="portal" id="portal">
    <!-- Próxima reunião -->
    <div class="next-meeting" id="next-meeting" style="display:none">
      <div class="label">Próxima reunião</div>
      <div class="data" id="next-data"></div>
      <div class="hora" id="next-hora"></div>
    </div>

    <!-- Stats -->
    <div class="stats" id="stats"></div>

    <!-- Tabs -->
    <div class="tabs">
      <div class="tab active" data-tab="reunioes">Reuniões</div>
      <div class="tab" data-tab="decisoes">Decisões</div>
      <div class="tab" data-tab="financeiro">Financeiro</div>
      <div class="tab" data-tab="tarefas">Tarefas</div>
      <div class="tab" data-tab="documentos">Diretrizes</div>
    </div>

    <!-- Reuniões -->
    <div class="section active" id="sec-reunioes"></div>

    <!-- Decisões -->
    <div class="section" id="sec-decisoes"></div>

    <!-- Financeiro -->
    <div class="section" id="sec-financeiro"></div>

    <!-- Tarefas -->
    <div class="section" id="sec-tarefas"></div>

    <!-- Documentos -->
    <div class="section" id="sec-documentos"></div>

    <div class="msg-box">Dúvidas sobre o conselho? A Isabella entrará em contato na próxima reunião.</div>
  </div>
</div>

<script>
const API='/api/conselho';
const brl=v=>v?'R$ '+Number(v).toLocaleString('pt-BR',{minimumFractionDigits:0}):'-';
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
let CODIGO='';

// Auto-preencher hash
const hash=location.hash.slice(1);
if(hash){document.getElementById('codigo').value=hash;setTimeout(carregar,300);}
document.getElementById('codigo').addEventListener('keydown',e=>{if(e.key==='Enter')carregar();});

// Tabs
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',function(){
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));
  this.classList.add('active');document.getElementById('sec-'+this.dataset.tab).classList.add('active');
}));

async function carregar(){
  CODIGO=document.getElementById('codigo').value.trim();
  if(!CODIGO){document.getElementById('err').textContent='Digite o código';return;}
  document.getElementById('err').textContent='Carregando...';
  try{
    const r=await fetch(`${API}?acao=ver&codigo=${CODIGO}`);
    const j=await r.json();
    if(!j.ok){document.getElementById('err').textContent='Proposta não encontrada.';return;}
    document.getElementById('err').textContent='';
    document.getElementById('login-box').style.display='none';
    document.getElementById('portal').style.display='block';
    document.getElementById('h-sub').textContent=j.cliente||'';
    render(j);
  }catch(e){document.getElementById('err').textContent='Erro de conexão.';}
}

function formatData(d){
  if(!d)return'-';
  const dt=new Date(d+'T12:00:00');
  const dias=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const meses=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  return dias[dt.getDay()]+', '+dt.getDate()+' de '+meses[dt.getMonth()]+' de '+dt.getFullYear();
}

function render(j){
  // Próxima reunião
  if(j.proxima_reuniao){
    document.getElementById('next-meeting').style.display='block';
    document.getElementById('next-data').textContent=formatData(j.proxima_reuniao.data);
    document.getElementById('next-hora').textContent='às '+(j.proxima_reuniao.hora||'10:00')+' · por vídeo';
  }

  // Stats
  const reunioesRealizadas=(j.reunioes||[]).filter(r=>r.status==='realizada').length;
  const reunioesAgendadas=(j.reunioes||[]).filter(r=>r.status==='agendada').length;
  const totalDecisoes=(j.decisoes||[]).length;
  const parcelasPagas=(j.parcelas||[]).filter(p=>p.status==='paga').length;
  const totalParcelas=(j.parcelas||[]).length;
  document.getElementById('stats').innerHTML=
    `<div class="scard"><div class="n">${reunioesRealizadas}</div><div class="l">Reuniões realizadas</div></div>`+
    `<div class="scard"><div class="n">${totalDecisoes}</div><div class="l">Decisões tomadas</div></div>`+
    `<div class="scard"><div class="n">${parcelasPagas}/${totalParcelas}</div><div class="l">Parcelas pagas</div></div>`;

  // Reuniões
  const reunioes=(j.reunioes||[]).sort((a,b)=>b.data>a.data?1:b.data<a.data?-1:0);
  if(reunioes.length){
    document.getElementById('sec-reunioes').innerHTML=reunioes.map(r=>{
      let html=`<div class="reuniao"><div class="topo"><span class="dt">${formatData(r.data)} às ${r.hora||''}</span><span class="badge ${r.status}">${r.status}</span></div>`;
      if(r.pauta)html+=`<div class="pauta"><b>Pauta:</b> ${esc(r.pauta)}</div>`;
      if(r.resumo)html+=`<div class="resumo"><b>Resumo:</b> ${esc(r.resumo)}</div>`;
      if(r.decisoes&&r.decisoes.length){
        html+=`<div class="decisoes"><b style="font-size:12px;color:var(--soft)">Decisões desta reunião:</b>`;
        r.decisoes.forEach(d=>{if(d)html+=`<div class="decisao">${esc(d)}</div>`;});
        html+=`</div>`;
      }
      html+=`</div>`;
      return html;
    }).join('');
  } else {
    document.getElementById('sec-reunioes').innerHTML='<div class="card" style="text-align:center;color:var(--soft)">Nenhuma reunião registrada ainda.</div>';
  }

  // Decisões
  const decisoes=(j.decisoes||[]).sort((a,b)=>b.created>a.created?1:-1);
  if(decisoes.length){
    document.getElementById('sec-decisoes').innerHTML=decisoes.map(d=>
      `<div class="decisao-item"><div class="texto">${esc(d.texto)}</div><div class="meta">Registrada em ${formatData(d.data)}</div></div>`
    ).join('');
  } else {
    document.getElementById('sec-decisoes').innerHTML='<div class="card" style="text-align:center;color:var(--soft)">Decisões tomadas nas reuniões aparecerão aqui.</div>';
  }

  // Financeiro
  const parcelas=j.parcelas||[];
  if(parcelas.length){
    const totalPago=parcelas.filter(p=>p.status==='paga').reduce((a,p)=>a+(p.valor||0),0);
    const totalGeral=parcelas.reduce((a,p)=>a+(p.valor||0),0);
    let html=`<div class="card"><h3>Resumo financeiro</h3>
      <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px"><span style="color:var(--soft)">Total do contrato</span><span style="font-family:Fraunces;font-size:16px;color:var(--v)">${brl(totalGeral)}</span></div>
      <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px"><span style="color:var(--soft)">Pago</span><span style="font-family:Fraunces;font-size:16px;color:var(--green)">${brl(totalPago)}</span></div>
      <div style="display:flex;justify-content:space-between;padding:8px 0;font-size:13px"><span style="color:var(--soft)">Restante</span><span style="font-family:Fraunces;font-size:16px">${brl(totalGeral-totalPago)}</span></div>
    </div>`;
    html+='<h3 style="font-size:13px;color:var(--soft);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 10px">Parcelas</h3>';
    parcelas.forEach(p=>{
      const hoje=new Date().toISOString().slice(0,10);
      let cls=p.status;
      if(p.status==='pendente'&&p.vencimento<hoje)cls='atrasada';
      html+=`<div class="parcela ${cls}">
        <div class="info"><span class="num">Parcela ${p.numero}</span><span class="venc">${p.status==='paga'?'Pago em '+formatData(p.pago_em):'Vencimento: '+formatData(p.vencimento)}</span></div>
        <div><div class="valor">${brl(p.valor)}</div><span class="badge ${cls}">${cls==='atrasada'?'atrasada':p.status}</span></div>
      </div>`;
    });
    document.getElementById('sec-financeiro').innerHTML=html;
  } else {
    document.getElementById('sec-financeiro').innerHTML='<div class="card" style="text-align:center;color:var(--soft)">Parcelas serão exibidas aqui quando configuradas.</div>';
  }

  // Tarefas
  const tarefas=j.tarefas||[];
  if(tarefas.length){
    const pendentes=tarefas.filter(t=>t.status!=='concluida');
    const concluidas=tarefas.filter(t=>t.status==='concluida');
    let thtml='';
    if(pendentes.length){
      thtml+='<div style="margin-bottom:14px"><b style="font-size:11px;color:var(--soft);text-transform:uppercase;letter-spacing:.04em">Pendentes ('+pendentes.length+')</b></div>';
      pendentes.forEach(t=>{
        const prioColors={alta:'var(--red)',normal:'var(--v)',baixa:'var(--soft)'};
        const totalCk=t.checklist?t.checklist.length:0;
        const feitosCk=t.checklist?t.checklist.filter(c=>c.feito).length:0;
        thtml+=`<div style="border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:8px">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <b style="font-size:14px">${esc(t.titulo)}</b>
            <span class="badge" style="background:${prioColors[t.prioridade]||'var(--soft)'};color:#fff;font-size:10px">${t.prioridade||'normal'}</span>
          </div>
          ${t.descricao?'<div style="font-size:12px;color:var(--soft);margin-top:4px">'+esc(t.descricao)+'</div>':''}
          <div style="display:flex;gap:12px;margin-top:6px;font-size:11px;color:var(--soft)">
            ${t.responsavel?'<span>'+esc(t.responsavel)+'</span>':''}
            ${t.prazo?'<span>Prazo: '+formatData(t.prazo)+'</span>':''}
            ${totalCk?'<span>'+feitosCk+'/'+totalCk+' itens</span>':''}
          </div>`;
        if(t.checklist&&t.checklist.length){
          thtml+='<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--line)">';
          t.checklist.forEach(c=>{
            thtml+=`<div style="padding:3px 0;font-size:12px;${c.feito?'color:var(--green)':''}"><span style="margin-right:6px">${c.feito?'&#10003;':'&#9675;'}</span>${esc(c.item)}</div>`;
          });
          thtml+='</div>';
        }
        thtml+='</div>';
      });
    }
    if(concluidas.length){
      thtml+='<div style="margin:14px 0"><b style="font-size:11px;color:var(--soft);text-transform:uppercase;letter-spacing:.04em">Concluídas ('+concluidas.length+')</b></div>';
      concluidas.forEach(t=>{
        thtml+=`<div style="border:1px solid var(--green);border-radius:10px;padding:12px;margin-bottom:6px;opacity:.7">
          <div style="display:flex;justify-content:space-between"><span style="text-decoration:line-through;font-size:13px">${esc(t.titulo)}</span><span class="badge" style="background:var(--greenL);color:var(--green);font-size:10px">concluída</span></div>
          ${t.concluida_em?'<div style="font-size:11px;color:var(--soft);margin-top:2px">Concluída em '+formatData(t.concluida_em)+'</div>':''}
        </div>`;
      });
    }
    document.getElementById('sec-tarefas').innerHTML=thtml;
  } else {
    document.getElementById('sec-tarefas').innerHTML='<div class="card" style="text-align:center;color:var(--soft)">Tarefas do projeto aparecerão aqui.</div>';
  }

  // Documentos/Diretrizes
  const docs=j.documentos||[];
  if(docs.length){
    document.getElementById('sec-documentos').innerHTML=docs.map(d=>{
      const icons={diretriz:'◆',relatorio:'◎',ata:'◉',orientacao:'◇'};
      return`<div class="doc-item"><div class="doc-icon">${icons[d.tipo]||'◆'}</div><div class="doc-info"><div class="titulo">${esc(d.titulo)}</div><div class="desc">${esc(d.descricao||'')} · ${formatData(d.data)}</div></div></div>`;
    }).join('');
  } else {
    document.getElementById('sec-documentos').innerHTML='<div class="card" style="text-align:center;color:var(--soft)">Diretrizes e orientações das reuniões aparecerão aqui.</div>';
  }
}
</script>
</body>
</html>
